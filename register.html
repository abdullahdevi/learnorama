<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learnorama - Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Roboto', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen">

    <header class="bg-white shadow-md p-4 md:p-6 sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <img src="picture.png" alt="Learnorama Logo" class="h-10 w-10 object-contain">
                <h1 class="text-2xl font-bold text-emerald-700">Learnorama</h1>
            </div>
            <nav>
                <ul class="flex space-x-6 text-lg font-medium">
                    <li><a href="index.html" class="text-gray-600 hover:text-emerald-800 transition duration-300">Home</a></li>
                    <li><a href="Multimedia.html" class="text-gray-600 hover:text-emerald-800 transition duration-300">Multimedia</a></li>
                    <li><a href="resources.html" class="text-gray-600 hover:text-emerald-800 transition duration-300">Resources</a></li>
                    <li><a href="login.html" class="text-gray-600 hover:text-emerald-800 transition duration-300">Login</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section class="bg-gradient-to-r from-emerald-600 to-blue-800 text-white py-16 rounded-b-xl shadow-lg mx-auto max-w-7xl mt-4 px-4 text-center">
        <h1 class="text-4xl md:text-5xl font-extrabold mb-4">Create Your Account</h1>
        <p class="text-lg opacity-90">Join thousands of learners on Learnorama</p>
    </section>

    <main class="container mx-auto px-4 mt-10 max-w-md">
        <div class="bg-white p-8 rounded-xl shadow-md">

            <div id="error-msg" class="hidden bg-red-100 text-red-700 px-4 py-3 rounded-lg mb-4 text-sm"></div>
            <div id="success-msg" class="hidden bg-emerald-100 text-emerald-700 px-4 py-3 rounded-lg mb-4 text-sm"></div>

            <div class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
                    <input id="name" type="text" placeholder="John Doe"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                    <input id="email" type="email" placeholder="john@example.com"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <input id="password" type="password" placeholder="Min. 6 characters"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
                <button onclick="register()"
                    class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-lg transition duration-300">
                    Create Account
                </button>
            </div>

            <p class="text-center text-sm text-gray-500 mt-6">
                Already have an account? <a href="login.html" class="text-emerald-600 hover:underline font-medium">Login here</a>
            </p>
        </div>
    </main>

    <footer class="bg-gray-800 text-white py-8 rounded-t-xl mx-auto max-w-7xl px-4 mt-12">
        <div class="container mx-auto text-center text-sm">
            <p>&copy; 2024 Learnorama. All rights reserved.</p>
            <p class="mt-2 opacity-80">Empowering your learning journey.</p>
        </div>
    </footer>

    <script>
        async function register() {
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorMsg = document.getElementById('error-msg');
            const successMsg = document.getElementById('success-msg');

            errorMsg.classList.add('hidden');
            successMsg.classList.add('hidden');

            if (!name || !email || !password) {
                errorMsg.textContent = 'Please fill in all fields.';
                errorMsg.classList.remove('hidden');
                return;
            }

            try {
                const res = await fetch('http://localhost:5000/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });

                const data = await res.json();

                if (!res.ok) {
                    errorMsg.textContent = data.msg || 'Registration failed.';
                    errorMsg.classList.remove('hidden');
                    return;
                }

                localStorage.setItem('token', data.token);
                successMsg.textContent = 'Account created! Redirecting...';
                successMsg.classList.remove('hidden');
                setTimeout(() => window.location.href = 'dashboard.html', 1500);

            } catch (err) {
                errorMsg.textContent = 'Server error. Make sure the backend is running.';
                errorMsg.classList.remove('hidden');
            }
        }
    </script>

</body>
</html>
